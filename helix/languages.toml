# brew install texlab
# brew install marksman
# brew install ltex-ls-plus


[language-server.texlab]
command = "texlab"

[language-server.texlab.config.texlab.build]
onSave = true
auxDirectory = ".aux"
pdfDirectory = "."
forwardSearchAfter = true
args = [
    "-pdf",
    "-xelatex",
    "-auxdir=.aux",
    "-interaction=nonstopmode",
    "-synctex=1",
    # "-pvc",
    "%f"
]

[language-server.texlab.config.texlab.forwardSearch]
executable = "sioyek"
args = [
    "--nofocus",
    "--reuse-window",
    "--execute-command",
    "toggle_synctex",
    "--inverse-search",
    "texlab inverse-search -i \"%%1\" -l %%2",
    "--forward-search-file",
    "%f",
    "--forward-search-line",
    "%l",
    "%p",  
]

[language-server.texlab.config.texlab.chktex]
onOpenAndSave = true
onEdit = true

[language-server.ltex-ls-plus]
command = "ltex-ls-plus"

[language-server.ltex-ls-plus.config.ltex]
# 启用哪些文档类型的检查 (可根据需要勾选)
enabled = ["latex", "tex", "bibtex", "markdown"]
# 设置检查语言，支持 "zh-CN", "en-US" 等
language = "en-US"
additionalRules.motherTongue = "zh-CN"
completionEnabled = true


# 常用自定义规则与字典设置
# dictionary = { "zh-CN" = ["Helix", "TexLab", "Neovim"] } # 忽略拼写错误的自定义词汇
# disabledRules = { "zh-CN" = ["PROOFREADING"] }

# introduce new language server
[language-server.scls]
command = "simple-completion-language-server"

[language-server.scls.config]
feature_words = false                # enable completion by word
feature_snippets = true              # enable snippets
snippets_first = true                # completions will return before snippets by default
case_sensitive = false               # when true, only exact-case matches are suggested; when false, exact-case matches are just prioritized first
snippets_inline_by_word_tail = false # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = false        # enable "unicode input"
feature_paths = false                # enable path completion
feature_citations = false            # enable citation completion (only on `citation` feature enabled)


# write logs to /tmp/completion.log
[language-server.scls.environment]
RUST_LOG = "info,simple-completion-language-server=info"
LOG_FILE = "/tmp/completion.log"

[[language]]
name = "latex"
language-servers = ["texlab", "ltex-ls-plus", "scls"]
auto-format = true
indent = {tab-width = 4, unit = "\t"}


[[language]]
name = "markdown"
language-servers = ["marksman", "ltex-ls-plus", "scls"]


[language-server.rust-analyzer.config.rust-analyzer]
# 使用 clippy 替代 check
check.command = "clippy"
cargo.autoreload = true

# 启用所有 features（可选）
cargo.features = "all"

# 宏支持
procMacro.enable = true

# 测试解释器
interpret.tests = true
