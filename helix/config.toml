# requirement
# brew tap laishulu/macism
# brew install macism

theme = "nord"

[editor]
line-number = "relative"
cursorline = true
completion-trigger-len = 1
completion-timeout = 5
completion-replace = true

[editor.statusline]
left = ["mode", "spinner", "read-only-indicator", "file-modification-indicator"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"

[editor.whitespace.render]
space = "all"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
wrap-indicator = ""

# [editor.word-completion]
# enable = true
# # Set the trigger length lower so that words are completed more often
# trigger-length = 4

# macos automatically swith keylayout to en
[keys.normal]
"esc" = [":sh macism com.apple.keylayout.ABC", "normal_mode"]
[keys.insert]
"esc" = [":sh macism com.apple.keylayout.ABC", "normal_mode"]
